openapi: 3.0.3
info:
  title: Aluno API First
  description: API para gerenciamento de alunos
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080/api
    description: Servidor de Desenvolvimento

paths:
  /alunos:
    get:
      summary: Lista todos os alunos
      operationId: listarAlunos
      tags:
        - Alunos
      responses:
        '200':
          description: Lista de alunos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlunoResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

    post:
      summary: Cria um novo aluno
      operationId: criarAluno
      tags:
        - Alunos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
      responses:
        '201':
          description: Aluno criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /alunos/{id}:
    get:
      summary: Busca um aluno por ID
      operationId: buscarAlunoPorId
      tags:
        - Alunos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID do aluno
      responses:
        '200':
          description: Aluno encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoResponse'
        '404':
          description: Aluno não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

    put:
      summary: Atualiza um aluno existente
      operationId: atualizarAluno
      tags:
        - Alunos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID do aluno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
      responses:
        '200':
          description: Aluno atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Aluno não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

    delete:
      summary: Remove um aluno
      operationId: deletarAluno
      tags:
        - Alunos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID do aluno
      responses:
        '204':
          description: Aluno removido com sucesso
        '404':
          description: Aluno não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

components:
  schemas:
    AlunoRequest:
      type: object
      required:
        - nome
        - email
        - curso
      properties:
        nome:
          type: string
          maxLength: 100
          description: Nome completo do aluno
          example: "João Silva"
        email:
          type: string
          format: email
          maxLength: 100
          description: Email do aluno
          example: "joao.silva@email.com"
        curso:
          type: string
          maxLength: 50
          description: Curso do aluno
          example: "Engenharia de Software"
        semestre:
          type: integer
          minimum: 1
          maximum: 10
          description: Semestre atual do aluno
          example: 5
        ativo:
          type: boolean
          description: Status do aluno (ativo/inativo)
          default: true

    AlunoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID do aluno
          example: 1
        nome:
          type: string
          description: Nome completo do aluno
          example: "João Silva"
        email:
          type: string
          format: email
          description: Email do aluno
          example: "joao.silva@email.com"
        curso:
          type: string
          description: Curso do aluno
          example: "Engenharia de Software"
        semestre:
          type: integer
          description: Semestre atual do aluno
          example: 5
        ativo:
          type: boolean
          description: Status do aluno
          example: true
        dataCadastro:
          type: string
          format: date-time
          description: Data de cadastro do aluno

    ErroResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Data e hora do erro
        status:
          type: integer
          description: Código HTTP do erro
          example: 404
        error:
          type: string
          description: Mensagem de erro
          example: "Aluno não encontrado"
        path:
          type: string
          description: Caminho da requisição
          example: "/api/alunos/1"

tags:
  - name: Alunos
    description: Operações relacionadas aos alunos
